<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cyber Awareness Game</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .game-container {
      width: 700px;
      background: #1e293b;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      color: #38bdf8;
    }

    .level {
      font-size: 18px;
      margin-bottom: 10px;
      color: #facc15;
    }

    .scenario {
      background: #334155;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .choices button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: black;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .choices button:hover {
      background: #0ea5e9;
    }

    .feedback {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .correct {
      background: #14532d;
      color: #bbf7d0;
    }

    .wrong {
      background: #7f1d1d;
      color: #fecaca;
    }

    .next-btn {
      margin-top: 15px;
      padding: 10px 15px;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none;
    }

    .score {
      margin-top: 15px;
      font-size: 18px;
      color: #f8fafc;
    }
  </style>
</head>

<body>

<div class="game-container">
  <h1>Cyber Awareness Challenge</h1>

  <div class="level" id="level">Level 1</div>

  <div class="scenario" id="scenario"></div>

  <div class="choices" id="choices"></div>

  <div class="feedback" id="feedback"></div>

  <button class="next-btn" id="nextBtn">Next Level</button>

  <div class="score" id="score">Score: 0</div>
</div>

<script>
  const levels = [
    {
      scenario:
        "You receive an email saying your bank account will be locked unless you click a link immediately.",
      choices: [
        "Click the link quickly",
        "Ignore the email",
        "Verify with the bank through official channels"
      ],
      correct: 2,
      explanation:
        "Correct! This is likely a phishing attack. Always verify through official websites or phone numbers."
    },

    {
      scenario:
        "You are creating a new password for your social media account.",
      choices: [
        "Use '123456'",
        "Use your birthday",
        "Create a long password with symbols and numbers"
      ],
      correct: 2,
      explanation:
        "Strong passwords reduce the risk of hacking and credential theft."
    },

    {
      scenario:
        "You connect to free public Wi-Fi at a café to access your online banking.",
      choices: [
        "Use banking normally",
        "Use a VPN or avoid sensitive logins",
        "Share personal information freely"
      ],
      correct: 1,
      explanation:
        "Public Wi-Fi can be unsafe. Use a VPN or avoid sensitive activity."
    },

    {
      scenario:
        "A caller claims to be from tech support and asks for your password.",
      choices: [
        "Give the password",
        "Hang up and contact the company directly",
        "Share only part of the password"
      ],
      correct: 1,
      explanation:
        "This is social engineering. Legitimate companies never ask for passwords over calls."
    }
  ];

  let currentLevel = 0;
  let score = 0;

  const scenarioEl = document.getElementById("scenario");
  const choicesEl = document.getElementById("choices");
  const feedbackEl = document.getElementById("feedback");
  const nextBtn = document.getElementById("nextBtn");
  const levelEl = document.getElementById("level");
  const scoreEl = document.getElementById("score");

  function loadLevel() {
    const level = levels[currentLevel];

    levelEl.textContent = `Level ${currentLevel + 1}`;
    scenarioEl.textContent = level.scenario;

    choicesEl.innerHTML = "";
    feedbackEl.style.display = "none";
    nextBtn.style.display = "none";

    level.choices.forEach((choice, index) => {
      const button = document.createElement("button");
      button.textContent = choice;

      button.onclick = () => checkAnswer(index);

      choicesEl.appendChild(button);
    });
  }

  function checkAnswer(selected) {
    const level = levels[currentLevel];

    feedbackEl.style.display = "block";

    if (selected === level.correct) {
      feedbackEl.className = "feedback correct";
      feedbackEl.innerHTML =
        `<strong>Correct!</strong><br>${level.explanation}`;

      score += 10;
      scoreEl.textContent = `Score: ${score}`;

      nextBtn.style.display = "inline-block";
    } else {
      feedbackEl.className = "feedback wrong";
      feedbackEl.innerHTML =
        `<strong>Wrong Choice!</strong><br>${level.explanation}<br><br>Try again!`;

      score -= 2;
      if(score < 0) score = 0;

      scoreEl.textContent = `Score: ${score}`;
    }
  }

  nextBtn.onclick = () => {
    currentLevel++;

    if (currentLevel < levels.length) {
      loadLevel();
    } else {
      scenarioEl.innerHTML =
        "🎉 Congratulations! You completed the Cyber Awareness Challenge.";

      choicesEl.innerHTML = "";
      feedbackEl.style.display = "none";
      nextBtn.style.display = "none";

      levelEl.textContent = "Game Complete";
    }
  };

  loadLevel();
</script>

</body>
</html>
