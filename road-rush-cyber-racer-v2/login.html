<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="style.css"></head><body><nav class="nav"><a class="brand" href="index.html"><img src="assets/logo.png">ROAD RUSH</a><div class="links"></div></nav><main class="form card"><h1>Login</h1><p class="muted">Only registered players can play.</p><form id="loginForm"><input class="input" id="email" type="email" placeholder="Email" required><input class="input" id="password" type="password" placeholder="Password" required><label class="checkline"><input id="rememberMe" type="checkbox"> Remember me on this device</label><button class="btn primary" type="submit">Login</button><button class="btn ghost full" type="button" id="forgotBtn">Forgot password?</button></form></main><div class="modal" id="forgotModal"><div class="modal-box"><h2>Reset Password</h2><p class="muted">Enter your registered email and create a new password. This works locally because the prototype stores accounts in browser localStorage.</p><input class="input" id="resetEmail" type="email" placeholder="Registered email"><input class="input" id="newPassword" type="password" placeholder="New password"><div class="row-actions"><button class="btn primary" id="resetBtn">Update Password</button><button class="btn ghost" id="closeForgot">Cancel</button></div></div></div><div class="toast"></div><script src="app.js"></script></body></html>
